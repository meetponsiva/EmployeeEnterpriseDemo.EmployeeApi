name: EmployeeApi Code-First E2E (Build -> DEV -> UAT -> PROD -> COB)

on:
  push:
    branches: [ master, main ]

jobs:
  build-once:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Compile self-contained EF Core Migrations executable (includes Tables + SP + View + Fn!)
      - name: Build EF Migrations Bundle
        run: |
          dotnet restore EmployeeApi.csproj
          dotnet tool install --global dotnet-ef --version 10.*
          dotnet ef migrations bundle --self-contained -r linux-x64 -o ./efbundle

      - uses: actions/upload-artifact@v4
        with:
          name: ef-bundle
          path: ./efbundle

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build & Push EmployeeApi
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/employee-api:${{ github.sha }}

  deploy-dev:
    needs: build-once
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ef-bundle
      - name: Run EF Migrations on EmployeeDb_Dev
        run: |
          chmod +x ./efbundle
          ./efbundle --connection "${{ secrets.SQL_CONN_DEV }}"
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - run: az containerapp update -n ca-emp-api-dev -g rg-emp-lifecycle --image index.docker.io/${{ secrets.DOCKERHUB_USERNAME }}/employee-api:${{ needs.build-once.outputs.sha }}

  deploy-uat:
    needs: [build-once, deploy-dev]
    runs-on: ubuntu-latest
    environment: uat
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ef-bundle
      - name: Run EF Migrations on EmployeeDb_Uat
        run: |
          chmod +x ./efbundle
          ./efbundle --connection "${{ secrets.SQL_CONN_UAT }}"
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - run: az containerapp update -n ca-emp-api-uat -g rg-emp-lifecycle --image index.docker.io/${{ secrets.DOCKERHUB_USERNAME }}/employee-api:${{ needs.build-once.outputs.sha }}

  deploy-prod:
    needs: [build-once, deploy-uat]
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ef-bundle
      - name: Run EF Migrations on EmployeeDb_Prod
        run: |
          chmod +x ./efbundle
          ./efbundle --connection "${{ secrets.SQL_CONN_PROD }}"    
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - run: az containerapp update -n ca-emp-api-prod -g rg-emp-lifecycle --image index.docker.io/${{ secrets.DOCKERHUB_USERNAME }}/employee-api:${{ needs.build-once.outputs.sha }}

  deploy-cob:
    needs: [build-once, deploy-prod]
    runs-on: ubuntu-latest
    environment: cob
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ef-bundle
      - name: Run EF Migrations on EmployeeDb_Cob
        run: |
          chmod +x ./efbundle
          ./efbundle --connection "${{ secrets.SQL_CONN_COB }}"    
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - run: az containerapp update -n ca-emp-api-cob -g rg-emp-lifecycle --image index.docker.io/${{ secrets.DOCKERHUB_USERNAME }}/employee-api:${{ needs.build-once.outputs.sha }}
